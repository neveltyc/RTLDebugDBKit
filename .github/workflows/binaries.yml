name: Binaries

# The release platform set, built the same way on every push and every tag:
# ci.yml and release.yml both call this workflow, so the binary a release
# ships is produced by exactly the pipeline CI has been running all along.
#
# The set matches rwave's platform selection — linux-amd64, linux-arm64,
# windows-amd64, macos-arm64 — because the database is read next to a
# waveform: the exporter ships everywhere the viewer does.
on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-latest
            bin: dist/rtl-designdb-linux-amd64
            python: python3
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            bin: dist/rtl-designdb-linux-arm64
            python: python3
          - target: windows-amd64
            runs-on: windows-latest
            bin: dist/rtl-designdb-windows-amd64.exe
            python: python
          - target: macos-arm64
            runs-on: macos-latest
            bin: dist/rtl-designdb-macos-arm64
            python: python3
    steps:
      - uses: actions/checkout@v4

      # Explicit rather than relying on the image: a missing ccache would make
      # the cache below a silent no-op instead of a failure.
      - name: Install ccache
        if: runner.os == 'macOS'
        run: brew list ccache >/dev/null 2>&1 || brew install ccache

      # slang is a large dependency and the pin is exact, so the key is the
      # CMakeLists that carries it: the cache is reused until the pin moves.
      # macOS only. The Linux builds run inside the script's Alpine container,
      # where slang lands on a docker volume this cache cannot see, and on
      # Windows $HOME under Git Bash is a POSIX path native CMake would
      # misread. Both lose only the clone, not the compile.
      - name: Cache CPM sources
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ matrix.target }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.target }}-

      # Objects rather than sources, which is where the time goes. macOS only,
      # for the same two reasons as above: the Linux compile happens inside a
      # container this cache cannot reach, and MSVC is not a ccache target.
      # CMake reads the launcher from the environment, so build-release.sh
      # needs no argument for it.
      - name: Cache ccache objects
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.target }}-

      # The Linux targets go through the script's docker path — the runner
      # itself stays glibc, because JavaScript actions cannot run in an
      # Alpine container on arm64 runners, and the build must not care what
      # the runner is made of anyway. That split is also the proof the smoke
      # test below relies on: built against musl in the container, executed
      # against glibc on the runner.
      - name: Build release binary
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export CPM_SOURCE_CACHE="$HOME/.cache/CPM"
            if command -v ccache >/dev/null; then
              export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_MAXSIZE=500M
              export CMAKE_C_COMPILER_LAUNCHER=ccache
              export CMAKE_CXX_COMPILER_LAUNCHER=ccache
            fi
          fi
          bash scripts/build-release.sh --target ${{ matrix.target }}
          if [ "$RUNNER_OS" == "macOS" ] && command -v ccache >/dev/null; then
            ccache --show-stats
          fi

      # Every platform runs the binary it just built: export the example
      # designs and read the databases back. For the Linux pair this runs on
      # the bare glibc runner, so a dynamic dependency that crept into the
      # "static" binary fails here instead of on someone's farm.
      #
      # The whole fixture set rather than a chosen few. An export costs tens of
      # milliseconds, so the sweep is seconds per platform, and what it covers
      # is exactly what a second platform can differ about: `recursion` walks
      # until a thread's stack runs out and glibc, musl and macOS do not give a
      # thread the same stack, while every fixture carries file paths, and
      # Windows spells those differently. The mode list comes from the
      # verifier, so there is no second list to keep in step.
      - name: Export and read back
        run: |
          ${{ matrix.bin }} examples/basic/top.sv --top top -o design.db
          ${{ matrix.python }} scripts/verify-designdb.py design.db
          for mode in $(${{ matrix.python }} scripts/verify-designdb.py --list-modes); do
            ${{ matrix.bin }} "examples/constructs/$mode.sv" -o "$mode.db"
            ${{ matrix.python }} scripts/verify-designdb.py "$mode.db" "$mode"
          done

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rtl-designdb-${{ matrix.target }}
          path: dist/rtl-designdb-*
          if-no-files-found: error
