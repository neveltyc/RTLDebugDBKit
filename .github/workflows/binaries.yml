name: Binaries

# The release platform set, built the same way on every push and every tag:
# ci.yml and release.yml both call this workflow, so the binary a release
# ships is produced by exactly the pipeline CI has been running all along.
#
# The set matches rwave's platform selection — linux-amd64, linux-arm64,
# windows-amd64, macos-arm64 — because the database is read next to a
# waveform: the exporter ships everywhere the viewer does.
on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-latest
            bin: dist/rtl-designdb-linux-amd64
            python: python3
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            bin: dist/rtl-designdb-linux-arm64
            python: python3
          - target: windows-amd64
            runs-on: windows-latest
            bin: dist/rtl-designdb-windows-amd64.exe
            python: python
          - target: macos-arm64
            runs-on: macos-latest
            bin: dist/rtl-designdb-macos-arm64
            python: python3
    steps:
      - uses: actions/checkout@v4

      # slang is a large dependency and the pin is exact, so the key is the
      # CMakeLists that carries it: the cache is reused until the pin moves.
      # macOS only. The Linux builds run inside the script's Alpine container,
      # where slang lands on a docker volume this cache cannot see, and on
      # Windows $HOME under Git Bash is a POSIX path native CMake would
      # misread. Both lose only the clone, not the compile.
      - name: Cache CPM sources
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ matrix.target }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.target }}-

      # The Linux targets go through the script's docker path — the runner
      # itself stays glibc, because JavaScript actions cannot run in an
      # Alpine container on arm64 runners, and the build must not care what
      # the runner is made of anyway. That split is also the proof the smoke
      # test below relies on: built against musl in the container, executed
      # against glibc on the runner.
      - name: Build release binary
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export CPM_SOURCE_CACHE="$HOME/.cache/CPM"
          fi
          bash scripts/build-release.sh --target ${{ matrix.target }}

      # Every platform runs the binary it just built: export the example
      # design and read the database back. For the Linux pair this runs on
      # the bare glibc runner, so a dynamic dependency that crept into the
      # "static" binary fails here instead of on someone's farm.
      - name: Export and read back
        run: |
          ${{ matrix.bin }} examples/basic/top.sv --top top -o design.db
          ${{ matrix.python }} scripts/verify-designdb.py design.db

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rtl-designdb-${{ matrix.target }}
          path: dist/rtl-designdb-*
          if-no-files-found: error
