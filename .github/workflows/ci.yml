name: CI

# `push` is limited to main so a branch with an open pull request is not built
# twice for one commit; work in progress is covered by the `pull_request` event.
on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A second push supersedes the first rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Both SQLite configurations, because they compile different code: the
    # bundled amalgamation builds a sqlite3.c of our own and the system one
    # builds no C at all, so a C-language defect in the project() call is
    # invisible to whichever half is not run.
    #
    # Only the bundled half runs the fixtures. The two configurations link
    # different SQLite libraries against one writer and one schema, so the rows
    # they produce are the same rows; the system half proves it builds and
    # exports, and the sweep below would be the same assertions twice.
    name: build (${{ matrix.sqlite }} sqlite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sqlite: bundled
            cmake_flags: ""
            fixtures: true
          - sqlite: system
            cmake_flags: "-DDESIGNDB_SYSTEM_SQLITE=ON"
            fixtures: false
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev ccache

      - name: Install RTL front ends
        if: matrix.fixtures
        run: sudo apt-get install -y verilator iverilog

      # slang is a large dependency and the pin is exact, so the key is the
      # CMakeLists that carries it: the cache is reused until the pin moves.
      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      # The CPM cache holds slang's SOURCE; this holds its OBJECTS, which is
      # where the time goes. A push that changes only the harness recompiles
      # nothing of the dependency. Keyed per run so the cache is always
      # written, restored from the newest prefix match.
      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.sqlite }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.sqlite }}-

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCPM_SOURCE_CACHE=~/.cache/CPM
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.cmake_flags }}

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"
          ccache --show-stats

      # Anything used as a fixture has to be valid RTL first: several
      # "defects" chased during development were invalid RTL written by hand.
      # A file may declare that a front end cannot accept it, and the script
      # fails on a declaration that has outlived its reason, so the markers
      # cannot rot.
      - name: Lint the fixtures
        if: matrix.fixtures
        run: |
          rc=0
          for f in examples/*/*.sv; do bash scripts/check-rtl.sh "$f" || rc=1; done
          exit $rc

      # A build that links proves the pin resolves; it does not prove the
      # exporter still writes a database. The system-sqlite half stops here.
      - name: Smoke export
        if: ${{ !matrix.fixtures }}
        run: |
          ./build/rtl-designdb examples/basic/top.sv --top top -o design.db
          python3 scripts/verify-designdb.py design.db

      # Export and read back: the basic example for the hollow check, then one
      # fixture per construct family. The mode list comes from the verifier, so
      # adding a fixture does not mean editing this loop. No --top for the
      # family, so meta.top's slang-elected spelling is what gets asserted.
      - name: Export and read back
        if: matrix.fixtures
        run: |
          ./build/rtl-designdb examples/basic/top.sv --top top -o design.db
          python3 scripts/verify-designdb.py design.db
          for mode in $(python3 scripts/verify-designdb.py --list-modes); do
            ./build/rtl-designdb "examples/constructs/$mode.sv" -o "$mode.db"
            python3 scripts/verify-designdb.py "$mode.db" "$mode"
          done
          # The CLI itself, which the constructs family never exercises: two
          # files sharing one compilation unit (so a macro defined in the first
          # reaches the second), a header found only through +incdir+, a define
          # from the command line, and two uninstantiated tops -- the case that
          # makes meta.top space-separated.
          (cd examples/options && ../../build/rtl-designdb -f opts.f --single-unit \
             +incdir+. +define+EXTRA_WIDTH=4 -o "$GITHUB_WORKSPACE/options.db")
          python3 scripts/verify-designdb.py options.db
          (cd examples/reorder && ../../build/rtl-designdb -f reorder.f \
             -o "$GITHUB_WORKSPACE/reorder.db")
          python3 scripts/verify-designdb.py reorder.db

      # What keeps the fixture set driven by the schema rather than by
      # whichever constructs happened to break once: every value the schema
      # publishes -- the enum domains and the four view vocabularies -- must
      # be produced by some database above. A value with no fixture is a
      # branch a consumer may write and nothing exercises; a value no input
      # can reach does not belong in the domain at all.
      - name: Published values have fixtures
        if: matrix.fixtures
        run: python3 scripts/verify-designdb.py --domain-coverage ./*.db

      # Two exports of one unchanged design, diffed row by row across every
      # table. It does not know what it is looking for, which is the point --
      # but the races it looks for need slang's THREADED source loader, and
      # that starts at four filelist entries. examples/constructs is one file
      # and examples/options two, so both read serially; examples/reorder is
      # five in reverse alphabetical order and exists for this. Its filelist
      # carries the reasoning.
      #
      # The deterministic half is in verify-designdb.py above -- src_file ids
      # must ascend with path -- and options and reorder both fail it outright
      # when the ids follow the buffers.
      - name: Reproducible export
        if: matrix.fixtures
        run: |
          python3 scripts/check-reproducible.py ./build/rtl-designdb \
            examples/constructs/constructs.sv
          (cd examples/options && python3 ../../scripts/check-reproducible.py \
             ../../build/rtl-designdb -f opts.f --single-unit +incdir+. \
             +define+EXTRA_WIDTH=4)
          (cd examples/reorder && python3 ../../scripts/check-reproducible.py \
             -n 10 ../../build/rtl-designdb -f reorder.f)

  # The four release platforms, as workflow artifacts on every push. The same
  # workflow builds a tagged release, so a red push here is a release that
  # would have failed.
  binaries:
    uses: ./.github/workflows/binaries.yml
