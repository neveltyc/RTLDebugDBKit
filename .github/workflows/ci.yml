name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    # Both SQLite configurations, because they compile different code: the
    # bundled amalgamation builds a sqlite3.c of our own and the system one
    # builds no C at all, so a C-language defect in the project() call is
    # invisible to whichever half is not run.
    name: build (${{ matrix.sqlite }} sqlite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sqlite: bundled
            cmake_flags: ""
          - sqlite: system
            cmake_flags: "-DDESIGNDB_SYSTEM_SQLITE=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev
      # slang is a large dependency and the pin is exact, so the key is the
      # CMakeLists that carries it: the cache is reused until the pin moves.
      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCPM_SOURCE_CACHE=~/.cache/CPM
          ${{ matrix.cmake_flags }}
      - name: Build
        run: cmake --build build -j"$(nproc)"
      # A build that links proves the pin resolves; it does not prove the
      # exporter still writes a database. Export and read back: the basic
      # example for the hollow check, and the constructs family for the
      # facts the schema contracts -- self-feedback, primitives, UDPs and
      # switches, port bit windows, waits and delays, interface bindings,
      # cross-instance dataflow through resolved hierarchical references,
      # per-call-site task expansion, level-sensitive events, design
      # boundary endpoints, generate arrays, non-ANSI ports, and a
      # deliberate black box. No --top on the constructs family, so
      # meta.top's slang-elected spelling is what gets asserted.
      - name: Export and read back
        run: |
          ./build/rtl-designdb examples/basic/top.sv --top top -o design.db
          python3 scripts/verify-designdb.py design.db
          for mode in constructs interfaces assertions hierarchy udp unresolved xmr alias external package callsite paramfold portshape compound macroloc stmtgaps patterncase outward naming aliascat; do
            ./build/rtl-designdb "examples/constructs/$mode.sv" -o "$mode.db"
            python3 scripts/verify-designdb.py "$mode.db" "$mode"
          done
          # The CLI itself, which the constructs family never exercises: two
          # files sharing one compilation unit (so a macro defined in the first
          # reaches the second), a header found only through +incdir+, a define
          # from the command line, and two uninstantiated tops -- the case that
          # makes meta.top space-separated.
          (cd examples/options && ../../build/rtl-designdb -f opts.f --single-unit \
             +incdir+. +define+EXTRA_WIDTH=4 -o "$GITHUB_WORKSPACE/options.db")
          python3 scripts/verify-designdb.py options.db

      # Two exports of one unchanged design, diffed row by row across every
      # table. `src_file` ids used to follow slang's buffer order, which is
      # the order a thread pool finished reading files in, so two exports of
      # tinyriscv disagreed on 44 of 15,773 rows while holding the same
      # design -- and a whole-database diff could not tell "the source
      # changed" from "the exporter ran again".
      #
      # This is the general check and the weaker one here: it does not know
      # what it is looking for, but the races it looks for need more files
      # than these examples have. examples/options, at three files, came out
      # in the same wrong order every time. The deterministic half is in
      # verify-designdb.py above -- src_file ids must ascend with path, which
      # options fails outright when the ids follow buffer order.
      - name: Reproducible export
        run: |
          python3 scripts/check-reproducible.py ./build/rtl-designdb \
            examples/constructs/constructs.sv
          (cd examples/options && python3 ../../scripts/check-reproducible.py \
             ../../build/rtl-designdb -f opts.f --single-unit +incdir+. \
             +define+EXTRA_WIDTH=4)

  # The four release platforms, as workflow artifacts on every push. The same
  # workflow builds a tagged release, so a red push here is a release that
  # would have failed.
  binaries:
    uses: ./.github/workflows/binaries.yml
