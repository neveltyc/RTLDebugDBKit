name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    # Both SQLite configurations, because they compile different code: the
    # bundled amalgamation builds a sqlite3.c of our own and the system one
    # builds no C at all, so a C-language defect in the project() call is
    # invisible to whichever half is not run.
    name: build (${{ matrix.sqlite }} sqlite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sqlite: bundled
            cmake_flags: ""
          - sqlite: system
            cmake_flags: "-DDESIGNDB_SYSTEM_SQLITE=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev
      # slang is a large dependency and the pin is exact, so the key is the
      # CMakeLists that carries it: the cache is reused until the pin moves.
      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCPM_SOURCE_CACHE=~/.cache/CPM
          ${{ matrix.cmake_flags }}
      - name: Build
        run: cmake --build build -j"$(nproc)"
      # A build that links proves the pin resolves; it does not prove the
      # exporter still writes a database. Export and read back: the basic
      # example for the hollow check, and the constructs family for the
      # facts the schema contracts -- self-feedback, primitives, UDPs and
      # switches, port bit windows, waits and delays, interface bindings,
      # cross-instance dataflow through resolved hierarchical references,
      # per-call-site task expansion, level-sensitive events, design
      # boundary endpoints, generate arrays, non-ANSI ports, and a
      # deliberate black box. No --top on the constructs family, so
      # meta.top's slang-elected spelling is what gets asserted.
      - name: Export and read back
        run: |
          ./build/rtl-designdb examples/basic/top.sv --top top -o design.db
          python3 scripts/verify-designdb.py design.db
          for mode in constructs interfaces assertions hierarchy udp unresolved xmr alias external package; do
            ./build/rtl-designdb "examples/constructs/$mode.sv" -o "$mode.db"
            python3 scripts/verify-designdb.py "$mode.db" "$mode"
          done

  # The four release platforms, as workflow artifacts on every push. The same
  # workflow builds a tagged release, so a red push here is a release that
  # would have failed.
  binaries:
    uses: ./.github/workflows/binaries.yml
